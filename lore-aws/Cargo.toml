[package]
name = "lore-aws"
edition = "2024"
version.workspace = true
publish = false

[dependencies]
async-trait = "0.1.89"

aws-config = { version = "1.8.12", default-features = false, features = ["rt-tokio"] }
aws-sdk-dynamodb = { version = "1.103.0", default-features = false, features = ["rt-tokio"] }
aws-sdk-s3 = { version = "1.121.0", default-features = false, features = ["rt-tokio"] }
aws-smithy-runtime-api = { version = "1.11.3", default-features = false }
aws-smithy-http-client = { version = "1.1.1", default-features = false, features = ["rustls-ring"] }
aws-smithy-types = { version = "1.4.3", default-features = false }
aws-types = { version = "1.3.11", default-features = false }
bytes = { version = "1.11.1", features = ["serde"] }

chrono = { version = "0.4.42", default-features = false, features = ["alloc", "clock"] }

dashmap = "6.1.0"

hex = "0.4.3"

opentelemetry = "0.31.0"

opentelemetry_sdk = { version = "0.31.0", features = ["rt-tokio"] }

opentelemetry-semantic-conventions = { version = "0.31.0", features = ["semconv_experimental"] }

smallvec = "1.15.1"

serde = { version = "1.0.219", default-features = false, features = ["derive"] }

serde_bytes = "0.11.17"

serde_dynamo = { version = "4.2.14", features = ["aws-sdk-dynamodb+1"] }
thiserror = "2.0.16"

tokio = { version = "1.47.1", features = [ "fs", "io-util", "macros", "net", "parking_lot", "rt", "rt-multi-thread", "signal", "sync", "time", ] }

tracing = { version = "0.1.41", features = ["release_max_level_debug"] }

zerocopy = { version = "0.8.26", features = [ "derive", "alloc", "simd", ] }

lore-base = { path = "../lore-base" }

lore-storage = { path = "../lore-storage" }

lore-revision = { path = "../lore-revision" }

lore-error-set = { path = "../lore-error-set" }

lore-macro = { path = "../lore-macro" }

lore-telemetry = { path = "../lore-telemetry" }


[dev-dependencies]
mockall = "0.13.1"

rand = "0.9.2"

serial_test = "3.3.1"
temp-env = "0.3.6"

tracing-test = "0.2.5"

uuid = { version = "1.18.1", default-features = false, features = ["v4", "v7"] }

lore-proto = { path = "../lore-proto" }


[features]
default = []
mocks = []
