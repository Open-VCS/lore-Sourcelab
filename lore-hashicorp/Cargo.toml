[package]
name = "lore-hashicorp"
edition = "2024"
version.workspace = true
publish = false

[dependencies]
async-trait = "0.1.89"

opentelemetry = "0.31.0"

opentelemetry_sdk = { version = "0.31.0", features = ["rt-tokio"] }

rand = "0.9.2"

rs-consul = "0.13.0"
tokio = { version = "1.47.1", features = [ "fs", "io-util", "macros", "net", "parking_lot", "rt", "rt-multi-thread", "signal", "sync", "time", ] }

tracing = { version = "0.1.41", features = ["release_max_level_debug"] }

lore-revision = { path = "../lore-revision" }

lore-telemetry = { path = "../lore-telemetry" }

urlencoding = "2.1.3"


[dev-dependencies]
lore-base = { path = "../lore-base" }

mockall = "0.13.1"

rand = "0.9.2"

temp-env = "0.3.6"

uuid = { version = "1.18.1", default-features = false, features = ["v4", "v7"] }

